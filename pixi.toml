[workspace]
name = "mfusg"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "linux-aarch64", "osx-arm64", "osx-64"]
version = "1.6.0.dev0"

[dependencies]
filelock = "*"
meson = ">=1.7.0"
ninja = "*"
modflow-devtools = "*"
flopy = "*"
pytest = "*"
pytest-xdist = "*"


[tasks]

# meson build
setup = { cmd = "meson setup --prefix=$(pwd) --bindir=bin", env = { PKG_CONFIG_PATH = "$CONDA_PREFIX/lib/pkgconfig" } }
build = "meson install -C"

# tests
test = { cmd = "pytest -v -n auto", cwd = "autotest" }
unittest = "meson test --verbose --no-rebuild -C"

# get ostag for system
get-ostag = { cmd = "python -c 'from modflow_devtools.ostags import get_ostag; print(get_ostag())'"}

[environments]
gcc-build = { features = ["gcc-build"] }

# Features
[feature.gcc-build]
platforms = ["linux-64", "osx-arm64"]

[feature.gcc-build.dependencies]
gfortran = "13.*"
pkg-config = "*"
test-drive = "*"
# gfortran 13 cannot read the module files of test-drive builds made with
# gfortran 15, so keep the runtime, and with it test-drive, below 15
libgfortran5 = "<15"
