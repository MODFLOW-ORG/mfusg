name: mfusg build
on:
  # run at 6 AM UTC every day
  schedule:
    - cron: '0 6 * * *'
  push:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PIXI_BETA_WARNING_OFF: true
  PROJ_NAME: mfusg
  LONG_NAME: MODFLOW USG
jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.compiler }} ${{ matrix.version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # gcc
          - {os: ubuntu-latest, compiler: gcc, version: 13, shell: bash}
          - {os: macos-15, compiler: gcc, version: 13, shell: bash, xcode-version: '16.4'}
          - {os: windows-latest, compiler: gcc, version: 13, shell: pwsh}
          # intel
          - {os: ubuntu-22.04, compiler: intel, version: "2025.0", shell: bash}
          - {os: windows-2022, compiler: intel, version: "2025.0", shell: pwsh}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout ${{ env.PROJ_NAME }}
        uses: actions/checkout@v5
        with:
          path: ${{ env.PROJ_NAME }}

      - name: Setup ${{ matrix.compiler }} ${{ matrix.version }}
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: ${{ matrix.compiler}}
          version: ${{ matrix.version }}

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.2
        with:
          pixi-version: v0.82.1
          manifest-path: "${{ env.PROJ_NAME }}/pixi.toml"

      - name: Set xcode version (macOS)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode-version }}

      - name: Show toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          xcode-select -p
          xcrun --show-sdk-version
          ld -v 2>&1 | head -2
          gfortran --version | head -1

      # static link gfortran libs
      - name: Hide dylibs (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ env.PROJ_NAME }}
        run: |
          version="${{ matrix.version }}"
          brew_prefix="$(brew --prefix)"
          libpath="$brew_prefix/opt/gcc@$version/lib/gcc/$version"
          mv $libpath/libgcc_s.1.1.dylib $libpath/libgcc_s.1.1.dylib.bak
          mv $libpath/libgfortran.5.dylib $libpath/libgfortran.5.dylib.bak
          mv $libpath/libquadmath.0.dylib $libpath/libquadmath.0.dylib.bak
          mv $libpath/libstdc++.6.dylib $libpath/libstdc++.6.dylib.bak

      # use classic xcode linker, static link libgcc
      - name: Set LDFLAGS (macOS)
        if: runner.os == 'macOS'
        run: |
          ldflags="$LDFLAGS -Wl,-ld_classic -static-libgcc"
          echo "LDFLAGS=$ldflags" >> $GITHUB_ENV

      - name: Build single precision
        working-directory: ${{ env.PROJ_NAME }}
        run: |
          pixi run setup builddir
          pixi run build builddir

      - name: Build double precision
        working-directory: ${{ env.PROJ_NAME }}
        run: |
          pixi run setup builddir-dble -Ddouble=true
          pixi run build builddir-dble

      - name: Test ${{ env.PROJ_NAME }}
        working-directory: ${{ env.PROJ_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pixi run test

      - name: Check arch/deps (macOS)
        working-directory: ${{ env.PROJ_NAME }}/bin
        if: runner.os == 'macOS'
        run: |
          otool -L mfusg
          otool -L mfusgdbl
          lipo -info mfusg
          lipo -info mfusgdbl

      - name: Show build log
        if: failure()
        working-directory: ${{ env.PROJ_NAME }}
        run: cat builddir/meson-logs/meson-log.txt

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.compiler}}-${{ matrix.version }}-meson-log.txt
          path: ${{ env.PROJ_NAME }}/builddir/meson-logs/meson-log.txt

  pixi-gcc-build:
    name: Pixi gcc-build environment testing
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout ${{ env.PROJ_NAME }}
        uses: actions/checkout@v5

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.82.1

      - name: Build single precision in the gcc-build environment
        run: |
          pixi run -e gcc-build setup builddir
          pixi run -e gcc-build build builddir

      - name: Build double precision in the gcc-build environment
        run: |
          pixi run -e gcc-build setup builddir-dble -Ddouble=true
          pixi run -e gcc-build build builddir-dble

      - name: Test in the gcc-build environment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pixi run -e gcc-build test

      - name: Show build log
        if: failure()
        run: cat builddir/meson-logs/meson-log.txt
