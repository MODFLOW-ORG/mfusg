name: mfusg release
on:
  # start a release from main with the version to release
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.5.1'
        required: true
        type: string
  # publish the release when the release pull request is merged
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  PIXI_BETA_WARNING_OFF: true
  DIST: dist-path
  PROGRAM_NAME: mfusg
jobs:
  prepare:
    name: Prepare release branch
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      branch: ${{ steps.branch.outputs.branch }}
      version: ${{ inputs.version }}
    steps:
      - name: Checkout ${{ env.PROGRAM_NAME }}
        uses: actions/checkout@v7

      - name: Check inputs
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "${{ github.ref_name }}" != "main" ]]; then
            echo "::error::Start a release from main, not ${{ github.ref_name }}."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version $VERSION is not major.minor.patch."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi

      - name: Commit version to release branch
        id: branch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          python3 distribution/update_version.py --version "$VERSION"
          git commit -am "chore(release): set version to $VERSION"
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

  check:
    name: Check for release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout ${{ env.PROGRAM_NAME }}
        uses: actions/checkout@v7

      # release only when main holds a release version without a tag
      - name: Check version
        id: check
        run: |
          version=$(python3 distribution/update_version.py --get)
          release=false
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && \
             ! git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            release=true
          fi
          echo "version $version, release $release"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.os }} ${{ matrix.compiler }} ${{ matrix.version }}
    needs:
      - prepare
      - check
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.check.outputs.release == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - {os: ubuntu-22.04, compiler: intel, version: "2025.0", shell: bash}
          - {os: macos-15, compiler: gcc, version: 13, shell: bash, xcode-version: '16.4'}
          - {os: windows-2022, compiler: intel, version: "2025.0", shell: pwsh}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout ${{ env.PROGRAM_NAME }}
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.branch || github.sha }}
          path: ${{ env.PROGRAM_NAME }}

      - name: Setup ${{ matrix.compiler }} ${{ matrix.version }} on ${{ matrix.os }}
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: ${{ matrix.compiler}}
          version: ${{ matrix.version }}

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.82.1
          manifest-path: "${{ env.PROGRAM_NAME }}/pixi.toml"

      - name: Set ostag
        shell: bash
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          echo "ostag=$(pixi run get-ostag)" >> $GITHUB_ENV

      - name: Set xcode version (macOS)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode-version }}

      - name: Show toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          xcode-select -p
          xcrun --show-sdk-version
          ld -v 2>&1 | head -2
          gfortran --version | head -1

      # static link gfortran libs
      - name: Hide dylibs (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          version="${{ matrix.version }}"
          brew_prefix="$(brew --prefix)"
          libpath="$brew_prefix/opt/gcc@$version/lib/gcc/$version"
          mv $libpath/libgcc_s.1.1.dylib $libpath/libgcc_s.1.1.dylib.bak
          mv $libpath/libgfortran.5.dylib $libpath/libgfortran.5.dylib.bak
          mv $libpath/libquadmath.0.dylib $libpath/libquadmath.0.dylib.bak
          mv $libpath/libstdc++.6.dylib $libpath/libstdc++.6.dylib.bak

      # use classic xcode linker, static link libgcc
      - name: Set LDFLAGS (macOS)
        if: runner.os == 'macOS'
        run: |
          ldflags="$LDFLAGS -Wl,-ld_classic -static-libgcc"
          echo "LDFLAGS=$ldflags" >> $GITHUB_ENV

      - name: Build single precision version of ${{ env.PROGRAM_NAME }}
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          pixi run setup builddir
          pixi run build builddir

      - name: Build double precision version of ${{ env.PROGRAM_NAME }}
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          pixi run setup builddir-dble -Ddouble=true
          pixi run build builddir-dble

      - name: Test ${{ env.PROGRAM_NAME }}
        working-directory: ${{ env.PROGRAM_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pixi run test

      - name: Check architecture (macOS)
        working-directory: ${{ env.PROGRAM_NAME }}/bin
        if: runner.os == 'macOS'
        run: |
          otool -L mfusg
          otool -L mfusgdbl
          if otool -L mfusg mfusgdbl | grep -E 'libgfortran|libgcc_s|libquadmath'; then
            echo "error: binaries dynamically link gcc/gfortran runtime libraries"
            exit 1
          fi
          lipo -info mfusg
          lipo -info mfusgdbl

      - name: Show build log
        if: failure()
        working-directory: ${{ env.PROGRAM_NAME }}
        run: cat builddir/meson-logs/meson-log.txt

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-${{ matrix.compiler}}-${{ matrix.version }}-meson-log.txt
          path: ${{ env.PROGRAM_NAME }}/builddir/meson-logs/meson-log.txt

      - name: Create source zip file on Linux
        if: runner.os == 'Linux'
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          zip -r ${{ env.PROGRAM_NAME }}_source.zip meson.build meson.options src/
          ls -lha *.zip

      - name: Create zip file on MacOS and Linux
        if: runner.os != 'Windows'
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          zip -r -j ${ostag}.zip bin/
          ls -lha *.zip

      - name: Create zip file on Windows
        if: runner.os == 'Windows'
        working-directory: ${{ env.PROGRAM_NAME }}
        run: |
          $ZipFileName = "$env:ostag.zip"
          Compress-Archive -Path "bin\*" -DestinationPath $ZipFileName
          ls *.zip

      - name: Upload distribution archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DIST }}-${{ matrix.os }}
          path: ${{ env.PROGRAM_NAME }}/*.zip

  pr:
    name: Open release pull request
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          body="Merging this pull request publishes the v$VERSION release. The release workflow builds and tests the executables, tags the merge commit, publishes the release, and opens a pull request that sets the version on main to the next development version."
          gh pr create -R "${{ github.repository }}" -B main -H "$BRANCH" \
            --title "chore(release): $VERSION" --body "$body"

  release:
    name: Publish release
    needs:
      - check
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.DIST }}*
          merge-multiple: true
          path: ${{ env.DIST }}

      - name: List distribution files
        run: ls -l ${{ env.DIST }}

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "v$VERSION" ${{ env.DIST }}/* -R "${{ github.repository }}" \
            --target "${{ github.sha }}" --title "${{ env.PROGRAM_NAME }} executables" \
            --notes "MODFLOW-USG version $VERSION" --latest

  reset:
    name: Open next version pull request
    needs:
      - check
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout ${{ env.PROGRAM_NAME }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Commit next version and create pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          next=$(python3 distribution/update_version.py --next)
          branch="release/v$next"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          python3 distribution/update_version.py --version "$next"
          git commit -am "chore(release): set version to $next"
          git push origin "$branch"
          gh pr create -R "${{ github.repository }}" -B main -H "$branch" \
            --title "chore(release): set version to $next" \
            --body "Set the version on main to $next after the v$VERSION release."
